  - name: Order Entry
    description: |
      Place, modify, and cancel orders, or manage an account's cancel-all-after countdown.
      Reya verifies signatures, signer permissions, order validity, and applicable pre-trade
      risk checks before accepting requests.

      **Rate limits.** Account budgets are shared across markets, signers, REST, and WebSocket
      requests. Create and modify share a placement budget; single cancels, bulk cancels, and
      cancel-all-after control have separate budgets. Resting orders also have count and
      notional limits. See the HTTP 400 response reference for errors and recovery guidance.

      **Every venue verdict is HTTP 400.** Rejections carry the reason in the body's `error`
      code and an optional `retryAfterMs`. Branch on the code to decide how to recover. HTTP 429 is
      reserved for infrastructure-level (per-IP) limits in front of the API and need not use
      the venue's JSON error format.

      **Cancellation reasons**

      Reason for a terminal `CANCELLED` order. `cancelReason` and `cancelReasonMessage`
      are omitted for other statuses and may be omitted when a cancellation reason is
      unavailable. Branch on `cancelReason`; `cancelReasonMessage` is explanatory text,
      not a stable contract to parse.

      - `NO_LIQUIDITY`: an IOC order filled nothing at its limit.
      - `IOC_REMAINDER`: an IOC order partially filled and its unfilled quantity was
        cancelled because no further executable liquidity was available. Both IOC reasons
        appear on create/modify responses.
      - `USER_CANCEL`, `MASS_CANCEL`, `CANCEL_ALL_AFTER`, `GTT_EXPIRED`: cancellation by a
        single cancel, bulk cancel, expired cancel-all-after countdown, or GTT expiry.
        These appear on `walletOrderChanges`.
      - `SELF_TRADE_PREVENTION`: an order would trade against the account's own resting
        order. Only the incoming order is cancelled; the resting order stays in place.
        This can appear on create/modify responses or a crossing modification's
        order-change event. Any fills already completed remain recorded.
      - `FEED_RESET`: rebuild the local order view from the following order events or `GET
        /v2/wallet/{address}/openOrders`. This notification does not mean the orders were
        cancelled on the exchange.
      - `RISK_CANCELLED`: a resting order was cancelled because it did not pass pre-trade
        risk checks when it was about to fill. Delivered on `walletOrderChanges`, with any
        previous fills preserved. A create or modify refused at request acceptance instead
        returns a `RequestErrorCode`.
      - `OCO_SIBLING_FIRED`: the paired stop-loss or take-profit fired and created its
        child order. The sibling is cancelled even when the child fills nothing.
        Cancelling a leg manually leaves its sibling armed; protection is not
        automatically re-armed.
      - `PROTECTIVE_SELF_TRADE_SWEEP`: a resting maker order was cancelled to allow a
        protective stop to execute without self-trading. This reason appears on the
        maker's cancellation, unlike `SELF_TRADE_PREVENTION`, which cancels the incoming
        order.
      - `POSITION_CLOSED`: no tradeable quantity remains to reduce. If the position has
        closed, reversed, or fallen below one lot before a stop fires, both protective
        legs are cancelled with `triggered: false` and no child is created. A fired
        child's remaining quantity is limited by the current reducible position; if that
        quantity is zero when it attempts to fill, its remainder is cancelled.
      - `RISK_REJECTED`: the proposed protective child failed pre-trade risk checks. Both
        protective legs are cancelled with `triggered: false`; no child is created and
        protection is not automatically retried or re-armed.

      A GTT stop or its resting child can be cancelled with `GTT_EXPIRED` before the
      signed `expiresAfter` to allow settlement. Explicit `cancelAll` includes fired
      children and reports `MASS_CANCEL`; cancel-all-after leaves armed protective stops
      and their fired children in place.
