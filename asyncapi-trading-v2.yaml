asyncapi: 3.0.0
info:
  title: Reya DEX Trading WebSocket API v2
  version: 3.0.30
  description: |
    Real-time WebSocket API for Reya Network's decentralized exchange. This version provides user-friendly real-time updates with simplified data structures, removing blockchain-specific details and using human-readable formats!

    ## Connection lifecycle, backpressure & recovery

    Channels fall into two delivery classes with different backpressure behaviour:

    - **Stateful channels** — market depth (`/v2/market/{symbol}/depth`) and wallet order changes (`/v2/wallet/{address}/orderChanges`) — deliver an ordered stream anchored to an initial snapshot. The server enforces per-connection backpressure: a consumer that falls too far behind is disconnected with WebSocket close code `1013` and reason `slow consumer — resubscribe for fresh snapshot`. Separately, after an internal feed resynchronization (for example a matching-engine restart), affected subscribers are closed with close code `1012`; the reason string begins `feed resync — resubscribe for fresh snapshot` and carries a runtime-appended suffix — ` (reset)` or ` (gap)` — identifying the internal cause. The same close code `1012` is also used when the server retires a connection for operational reasons — such as a graceful shutdown/deploy drain (reason prefix `server draining …`) or load management — where the reason string begins with an operationally-descriptive prefix rather than `feed resync …`. Clients must key recovery on the close **code** `1012` and treat the reason string as advisory only (do not parse the prefix or suffix).
    - **Conflating channels** — asset oracle prices (`/v2/assetOraclePrices`) — coalesce under backpressure per symbol/asset: intermediate ticks may be dropped, but the latest value per symbol is always eventually delivered.

    Recovery is identical for both `1013` and `1012`: reconnect and resubscribe. The normal subscribe path replies with a fresh, consistent snapshot of the channel's documented view. Events that occurred during the disconnection window are **not** replayed — clients must not expect gap-fill of individual updates; per-fill attribution lives in the execution channels (`.../perpExecutions`, `.../spotExecutions`) and the corresponding REST endpoints.
  contact:
    name: Reya Network
    url: https://reya.xyz
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  tags:
    - name: markets
      description: Market data and summaries
    - name: wallet
      description: Wallet-specific data (positions, orders, executions)
    - name: prices
      description: Real-time price feeds
  externalDocs:
    description: Reya Network Documentation
    url: https://docs.reya.xyz

servers:
  production:
    host: ws.reya.xyz
    protocol: wss
    description: Production WebSocket server
  devnet:
    host: websocket-devnet.reya-cronos.network
    protocol: wss
    description: Devnet WebSocket server for Perp OB integration
  staging:
    host: websocket-staging.reya.xyz
    protocol: wss
    description: Staging WebSocket server
  test:
    host: websocket-testnet.reya.xyz
    protocol: wss
    description: Test WebSocket server

defaultContentType: application/json

channels:
  control:
    description: Channel for control messages like subscribe, unsubscribe, ping, etc.
    address: null
    messages:
      pingMessage:
        $ref: '#/components/messages/PingMessage'
      pongMessage:
        $ref: '#/components/messages/PongMessage'
      subscribeMessage:
        $ref: '#/components/messages/SubscribeMessage'
      unsubscribeMessage:
        $ref: '#/components/messages/UnsubscribeMessage'
      subscribedMessage:
        $ref: '#/components/messages/SubscribedMessage'
      unsubscribedMessage:
        $ref: '#/components/messages/UnsubscribedMessage'
      errorMessage:
        $ref: '#/components/messages/ErrorMessage'
    bindings:
      ws: {}

  perpMarketsSummary:
    address: /v2/perpMarkets/summary
    description: Perp market summary channel mirroring `/v2/spotMarkets/summary`. Real-time updates for all perp market summaries
    messages:
      marketsSummaryUpdate:
        $ref: '#/components/messages/MarketsSummaryUpdate'

  perpMarketSummary:
    address: /v2/perpMarket/{symbol}/summary
    description: Perp market summary channel mirroring `/v2/spotMarket/{symbol}/summary`. Real-time updates for a specific perp market's summary
    parameters:
      symbol:
        description: Trading symbol (e.g., BTCRUSDPERP)
        location: $message.payload#/symbol
    messages:
      marketSummaryUpdate:
        $ref: '#/components/messages/MarketSummaryUpdate'

  spotMarketsSummary:
    address: /v2/spotMarkets/summary
    description: Real-time updates for all spot market summaries
    messages:
      spotMarketsSummaryUpdate:
        $ref: '#/components/messages/SpotMarketsSummaryUpdate'

  spotMarketSummary:
    address: /v2/spotMarket/{symbol}/summary
    description: Real-time updates for a specific spot market's summary
    parameters:
      symbol:
        description: Trading symbol (e.g., WETHRUSD)
        location: $message.payload#/symbol
    messages:
      spotMarketSummaryUpdate:
        $ref: '#/components/messages/SpotMarketSummaryUpdate'

  marketPerpExecutions:
    address: /v2/market/{symbol}/perpExecutions
    description: Real-time perpetual executions for a specific market
    parameters:
      symbol:
        description: Trading symbol (e.g., BTCRUSDPERP, ETHRUSD)
        location: $message.payload#/symbol
    messages:
      marketPerpExecutionUpdate:
        $ref: '#/components/messages/MarketPerpExecutionUpdate'

  marketDepth:
    address: /v2/market/{symbol}/depth
    description: |
      Real-time L2 order book depth for a specific market.

      This is a stateful channel with snapshot + diff semantics. The nested
      depth payload discriminator (`contents.type` on the `subscribed` frame,
      `data.type` on `channel_data`) tells the client how to apply it:

      - Subscribing delivers one bounded `SNAPSHOT`: at most the 100 highest
        bid levels and at most the 100 lowest ask levels. Bids are sorted
        descending by `px`; asks are sorted ascending. WebSocket subscriptions
        have no client-selected depth limit. If a side contains more than 100
        levels, deeper levels are omitted from the published view.
      - Every subsequent `channel_data` frame is an `UPDATE` **diff** that carries
        **only the price levels whose state changed in that bounded view** since
        the previous frame — not another snapshot. When the 100-level boundary
        moves, this includes a newly visible level even if its underlying quantity
        did not change, and a zero-quantity removal for a displaced level even if
        that level still exists deeper in the full exchange book. An underlying
        change wholly outside the published view does not emit an `UPDATE`.
      - Each level's `qty` is ABSOLUTE: it is the level's new aggregated total at
        that `px`, not a signed delta. Overwrite the level at that `px` with the
        received `qty`.
      - A `qty` of `0` means delete that `px` from the published view. The level
        may have been fully consumed or may merely have moved outside the
        100-level boundary.
      - A single `UPDATE` frame may carry multiple changed levels, and levels for
        both `bids` and `asks` may appear together in the same frame. Either side
        may be empty, but every emitted `UPDATE` has at least one changed level.

      To maintain the exact published top-100 view: seed it from the `SNAPSHOT`,
      then apply each `UPDATE` frame in the order received — for every level,
      replace the total at its `px` (or delete the `px` when `qty` is `0`). This
      channel does not provide a complete book when either side exceeds 100
      levels; use a new subscription to recover a fresh bounded view.

      The server enforces per-connection backpressure — a consumer that falls
      behind is disconnected with close code `1013` (reason `slow consumer —
      resubscribe for fresh snapshot`). After an internal feed resynchronization
      (e.g. a matching-engine restart) subscribers are closed with close code
      `1012`; the reason string begins `feed resync — resubscribe for fresh
      snapshot` and carries a runtime-appended suffix (` (reset)` or ` (gap)`)
      identifying the internal cause — key recovery on the close **code** `1012`
      and treat the reason as advisory. The same `1012` is also sent when the
      server retires a connection for operational reasons (e.g. a graceful
      shutdown/deploy drain or load management), with a different reason prefix;
      recovery is unchanged. Recovery for both `1013` and `1012` is the
      same: reconnect and resubscribe; the subscribe path returns a fresh
      consistent bounded `SNAPSHOT` and updates from the disconnection window
      are not replayed. See the API overview for the shared
      connection-lifecycle contract.
    parameters:
      symbol:
        description: Trading symbol (e.g., BTCRUSDPERP, ETHRUSD)
        location: $message.payload#/symbol
    messages:
      marketDepthSubscribed:
        $ref: '#/components/messages/MarketDepthSubscribed'
      marketDepthUpdate:
        $ref: '#/components/messages/MarketDepthUpdate'

  marketSpotExecutions:
    address: /v2/market/{symbol}/spotExecutions
    description: Real-time spot executions for a specific market
    parameters:
      symbol:
        description: Trading symbol (e.g., ETHRUSD, BTCRUSD)
        location: $message.payload#/symbol
    messages:
      marketSpotExecutionUpdate:
        $ref: '#/components/messages/MarketSpotExecutionUpdate'

  walletPositions:
    address: /v2/wallet/{address}/positions
    description: Real-time position updates for a wallet
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      positionUpdate:
        $ref: '#/components/messages/PositionUpdate'

  walletOrderChanges:
    address: /v2/wallet/{address}/orderChanges
    description: |
      Real-time order change updates for a wallet.

      Two server-to-client message types arrive on this logical channel:
      `orderChangesSubscribed` is the initial `subscribed` confirmation and
      carries an `OrderChangesSnapshot` payload (current open orders plus a
      `snapshotSequenceNumber` cursor); `orderChangeUpdate` is every subsequent
      `channel_data` frame and carries order rows whose `sequenceNumber` is
      greater than `snapshotSequenceNumber`. The cursor lets clients splice the
      live feed against the `/wallet/{address}/orderHistory` REST endpoint.

      Each `orderChangeUpdate` frame batches losslessly: the `channel_data` `data`
      array may carry multiple order events in a single frame — every event is
      delivered (none are conflated or dropped) and clients must process the array
      in order.

      This is a stateful channel and enforces per-connection backpressure. A
      consumer that falls behind is disconnected with close code `1013` (reason
      `slow consumer — resubscribe for fresh snapshot`); after an internal feed
      resynchronization (e.g. a matching-engine restart) subscribers are closed
      with close code `1012`, whose reason string begins `feed resync —
      resubscribe for fresh snapshot` and carries a runtime-appended suffix
      (` (reset)` or ` (gap)`) — key recovery on the close **code** `1012` and
      treat the reason as advisory. The same `1012` is also sent when the server
      retires a connection for operational reasons (e.g. a graceful
      shutdown/deploy drain or load management), with a different reason prefix;
      recovery is unchanged. Recovery for both is the same: reconnect and
      resubscribe; the subscribe path returns a fresh consistent
      `OrderChangesSnapshot` and updates
      from the disconnection window are not replayed (the snapshot reflects the
      resulting order state; per-fill attribution lives in the executions data).
      See the API overview for the shared connection-lifecycle contract.
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      orderChangesSubscribed:
        $ref: '#/components/messages/OrderChangesSubscribed'
      orderChangeUpdate:
        $ref: '#/components/messages/OrderChangeUpdate'

  walletPerpExecutions:
    address: /v2/wallet/{address}/perpExecutions
    description: Real-time perpetual execution updates for a wallet
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      walletPerpExecutionUpdate:
        $ref: '#/components/messages/WalletPerpExecutionUpdate'

  walletSpotExecutions:
    address: /v2/wallet/{address}/spotExecutions
    description: Real-time spot execution updates for a wallet
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      walletSpotExecutionUpdate:
        $ref: '#/components/messages/WalletSpotExecutionUpdate'

  marketExecutionBusts:
    address: /v2/market/{symbol}/executionBusts
    description: Real-time execution busts (failed fills) for a specific market, covering both spot and perp
    parameters:
      symbol:
        description: Trading symbol (e.g., BTCRUSDPERP, ETHRUSD)
        location: $message.payload#/symbol
    messages:
      marketExecutionBustUpdate:
        $ref: '#/components/messages/MarketExecutionBustUpdate'

  walletExecutionBusts:
    address: /v2/wallet/{address}/executionBusts
    description: Real-time execution bust updates (failed fills) for a wallet, covering both spot and perp
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      walletExecutionBustUpdate:
        $ref: '#/components/messages/WalletExecutionBustUpdate'

  walletAccountBalances:
    address: /v2/wallet/{address}/accountBalances
    description: Real-time account balance updates for a wallet
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      accountBalanceUpdate:
        $ref: '#/components/messages/AccountBalanceUpdate'

  walletAccounts:
    address: /v2/wallet/{address}/accounts
    description: Real-time account creation and account-binding updates for a wallet
    parameters:
      address:
        description: Ethereum wallet address
        location: $message.payload#/address
    messages:
      accountUpdate:
        $ref: '#/components/messages/AccountUpdate'

  assetOraclePrices:
    address: /v2/assetOraclePrices
    description: |
      Asset Stork oracle price updates. This replacement feed deliberately omits
      AMM-era `poolPrice`.

      This is a conflating channel: under backpressure the server coalesces
      updates per asset — intermediate ticks may be dropped — but the latest
      price per asset is always eventually delivered, so consumers converge to
      current values. See the API overview for the shared connection-lifecycle
      contract.
    messages:
      assetOraclePricesUpdate:
        $ref: '#/components/messages/AssetOraclePricesUpdate'

operations:
  sendPing:
    action: send
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/pingMessage'
    reply:
      channel:
        $ref: '#/channels/control'
      messages:
        - $ref: '#/channels/control/messages/pongMessage'
    summary: Send a ping (optional)
    description: |
      Optional client-initiated application-level liveness/RTT probe. Server replies with `PongMessage` echoing the optional `id`. Server-side liveness detection uses RFC 6455 protocol-level pings (`sendPings: true`, `idleTimeout: 120`) and does not depend on this operation.

  sendSubscribe:
    action: send
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/subscribeMessage'
    summary: Send subscribe request
    description: Client sends subscribe to a specific channel.

  sendUnsubscribe:
    action: send
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/unsubscribeMessage'
    summary: Send unsubscribe request
    description: Client sends unsubscribe from a specific channel.

  receivePong:
    action: receive
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/pongMessage'
    summary: Receive pong response

  receiveSubscribed:
    action: receive
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/subscribedMessage'
    summary: Receive confirmation of subscription

  receiveUnsubscribed:
    action: receive
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/unsubscribedMessage'
    summary: Receive confirmation of unsubscription

  receiveError:
    action: receive
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/errorMessage'
    summary: Receive error messages

  receivePerpMarketsSummary:
    action: receive
    channel:
      $ref: '#/channels/perpMarketsSummary'
    messages:
      - $ref: '#/channels/perpMarketsSummary/messages/marketsSummaryUpdate'
    summary: Receive perp market summaries updates

  receivePerpMarketSummary:
    action: receive
    channel:
      $ref: '#/channels/perpMarketSummary'
    messages:
      - $ref: '#/channels/perpMarketSummary/messages/marketSummaryUpdate'
    summary: Receive specific perp market summary updates

  receiveSpotMarketsSummary:
    action: receive
    channel:
      $ref: '#/channels/spotMarketsSummary'
    messages:
      - $ref: '#/channels/spotMarketsSummary/messages/spotMarketsSummaryUpdate'
    summary: Receive all spot market summary updates

  receiveSpotMarketSummary:
    action: receive
    channel:
      $ref: '#/channels/spotMarketSummary'
    messages:
      - $ref: '#/channels/spotMarketSummary/messages/spotMarketSummaryUpdate'
    summary: Receive specific spot market summary updates

  receiveMarketPerpExecutions:
    action: receive
    channel:
      $ref: '#/channels/marketPerpExecutions'
    messages:
      - $ref: '#/channels/marketPerpExecutions/messages/marketPerpExecutionUpdate'
    summary: Receive perpetual execution updates for market

  receiveMarketDepth:
    action: receive
    channel:
      $ref: '#/channels/marketDepth'
    messages:
      - $ref: '#/channels/marketDepth/messages/marketDepthSubscribed'
      - $ref: '#/channels/marketDepth/messages/marketDepthUpdate'
    summary: Receive a bounded L2 depth snapshot and subsequent view updates for a specific market

  receiveMarketSpotExecutions:
    action: receive
    channel:
      $ref: '#/channels/marketSpotExecutions'
    messages:
      - $ref: '#/channels/marketSpotExecutions/messages/marketSpotExecutionUpdate'
    summary: Receive spot execution updates for market

  receiveWalletPositions:
    action: receive
    channel:
      $ref: '#/channels/walletPositions'
    messages:
      - $ref: '#/channels/walletPositions/messages/positionUpdate'
    summary: Receive position updates for wallet

  receiveWalletOrderChanges:
    action: receive
    channel:
      $ref: '#/channels/walletOrderChanges'
    messages:
      - $ref: '#/channels/walletOrderChanges/messages/orderChangesSubscribed'
      - $ref: '#/channels/walletOrderChanges/messages/orderChangeUpdate'
    summary: Receive order change updates for wallet

  receiveWalletPerpExecutions:
    action: receive
    channel:
      $ref: '#/channels/walletPerpExecutions'
    messages:
      - $ref: '#/channels/walletPerpExecutions/messages/walletPerpExecutionUpdate'
    summary: Receive perpetual execution updates for wallet

  receiveWalletSpotExecutions:
    action: receive
    channel:
      $ref: '#/channels/walletSpotExecutions'
    messages:
      - $ref: '#/channels/walletSpotExecutions/messages/walletSpotExecutionUpdate'
    summary: Receive spot execution updates for wallet

  receiveMarketExecutionBusts:
    action: receive
    channel:
      $ref: '#/channels/marketExecutionBusts'
    messages:
      - $ref: '#/channels/marketExecutionBusts/messages/marketExecutionBustUpdate'
    summary: Receive execution bust updates for market (spot + perp)

  receiveWalletExecutionBusts:
    action: receive
    channel:
      $ref: '#/channels/walletExecutionBusts'
    messages:
      - $ref: '#/channels/walletExecutionBusts/messages/walletExecutionBustUpdate'
    summary: Receive execution bust updates for wallet (spot + perp)

  receiveWalletAccountBalances:
    action: receive
    channel:
      $ref: '#/channels/walletAccountBalances'
    messages:
      - $ref: '#/channels/walletAccountBalances/messages/accountBalanceUpdate'
    summary: Receive account balance updates for wallet

  receiveWalletAccounts:
    action: receive
    channel:
      $ref: '#/channels/walletAccounts'
    messages:
      - $ref: '#/channels/walletAccounts/messages/accountUpdate'
    summary: Receive account creation and account-binding updates for wallet

  receiveAssetOraclePrices:
    action: receive
    channel:
      $ref: '#/channels/assetOraclePrices'
    messages:
      - $ref: '#/channels/assetOraclePrices/messages/assetOraclePricesUpdate'
    summary: Receive asset oracle price updates

components:
  correlationIds:
    requestId:
      description: The envelope `id` field, used to correlate a client ping with its server pong.
      location: '$message.payload#/id'

  messages:
    MarketsSummaryUpdate:
      name: marketsSummaryUpdate
      title: Markets Summary Update
      summary: Real-time update containing all market summaries
      payload:
        $ref: '#/components/schemas/MarketsSummaryUpdatePayload'

    MarketSummaryUpdate:
      name: marketSummaryUpdate
      title: Market Summary Update
      summary: Real-time update for a specific market summary
      payload:
        $ref: '#/components/schemas/MarketSummaryUpdatePayload'

    SpotMarketsSummaryUpdate:
      name: spotMarketsSummaryUpdate
      title: Spot Markets Summary Update
      summary: Real-time update containing all spot market summaries
      payload:
        $ref: '#/components/schemas/SpotMarketsSummaryUpdatePayload'

    SpotMarketSummaryUpdate:
      name: spotMarketSummaryUpdate
      title: Spot Market Summary Update
      summary: Real-time update for a specific spot market summary
      payload:
        $ref: '#/components/schemas/SpotMarketSummaryUpdatePayload'

    PositionUpdate:
      name: positionUpdate
      title: Position Update
      summary: Real-time position update for a wallet
      payload:
        $ref: '#/components/schemas/PositionUpdatePayload'

    OrderChangeUpdate:
      name: orderChangeUpdate
      title: Order Change Update
      summary: Real-time order change update for a wallet
      payload:
        $ref: '#/components/schemas/OrderChangeUpdatePayload'

    OrderChangesSubscribed:
      name: subscribed
      title: Order Changes Subscribed
      summary: |
        Initial `subscribed` confirmation for the orderChanges channel. The
        envelope is the generic subscribe-response shape; `contents` carries the
        typed `OrderChangesSnapshot` payload.
      payload:
        $ref: '#/components/schemas/OrderChangesSubscribedPayload'

    MarketPerpExecutionUpdate:
      name: marketPerpExecutionUpdate
      title: Market Perpetual Execution Update
      summary: Real-time perpetual execution update for market
      payload:
        $ref: '#/components/schemas/MarketPerpExecutionUpdatePayload'

    MarketDepthUpdate:
      name: marketDepthUpdate
      title: Market Depth Update
      summary: Real-time bounded L2 order book view update for a specific market
      payload:
        $ref: '#/components/schemas/MarketDepthUpdatePayload'

    MarketDepthSubscribed:
      name: subscribed
      title: Market Depth Subscribed
      summary: |
        Initial `subscribed` confirmation for the market depth channel. The
        envelope is the generic subscribe-response shape; `contents` carries a
        bounded `DepthSnapshot` payload containing at most 100 levels per side.
      payload:
        $ref: '#/components/schemas/MarketDepthSubscribedPayload'

    MarketSpotExecutionUpdate:
      name: marketSpotExecutionUpdate
      title: Market Spot Execution Update
      summary: Real-time spot execution update for market
      payload:
        $ref: '#/components/schemas/MarketSpotExecutionUpdatePayload'

    WalletPerpExecutionUpdate:
      name: walletPerpExecutionUpdate
      title: Wallet Perpetual Execution Update
      summary: Real-time perpetual execution update for wallet
      payload:
        $ref: '#/components/schemas/WalletPerpExecutionUpdatePayload'

    WalletSpotExecutionUpdate:
      name: walletSpotExecutionUpdate
      title: Wallet Spot Execution Update
      summary: Real-time spot execution update for wallet
      payload:
        $ref: '#/components/schemas/WalletSpotExecutionUpdatePayload'

    MarketExecutionBustUpdate:
      name: marketExecutionBustUpdate
      title: Market Execution Bust Update
      summary: Real-time execution bust update for market (spot + perp)
      payload:
        $ref: '#/components/schemas/MarketExecutionBustUpdatePayload'

    WalletExecutionBustUpdate:
      name: walletExecutionBustUpdate
      title: Wallet Execution Bust Update
      summary: Real-time execution bust update for wallet (spot + perp)
      payload:
        $ref: '#/components/schemas/WalletExecutionBustUpdatePayload'

    AccountBalanceUpdate:
      name: accountBalanceUpdate
      title: Account Balance Update
      summary: Real-time account balance update for wallet
      payload:
        $ref: '#/components/schemas/AccountBalanceUpdatePayload'

    AccountUpdate:
      name: accountUpdate
      title: Account Update
      summary: Real-time account creation or account-binding update for wallet
      payload:
        $ref: '#/components/schemas/AccountUpdatePayload'

    AssetOraclePricesUpdate:
      name: assetOraclePricesUpdate
      title: Asset Oracle Prices Update
      summary: Real-time asset Stork oracle price updates
      payload:
        $ref: '#/components/schemas/AssetOraclePricesUpdatePayload'

    PingMessage:
      name: ping
      title: Ping Message
      summary: Optional client-initiated application-level liveness/RTT probe
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/PingMessagePayload'

    PongMessage:
      name: pong
      title: Pong Message
      summary: Server reply to a client-initiated `ping`, echoing the optional `id`
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/PongMessagePayload'

    SubscribeMessage:
      name: subscribe
      title: Subscribe Message
      summary: Subscribe to a channel
      payload:
        $ref: '#/components/schemas/SubscribeMessagePayload'

    UnsubscribeMessage:
      name: unsubscribe
      title: Unsubscribe Message
      summary: Unsubscribe from a channel
      payload:
        $ref: '#/components/schemas/UnsubscribeMessagePayload'

    SubscribedMessage:
      name: subscribed
      title: Subscribed Message
      summary: Confirmation of successful subscription
      payload:
        $ref: '#/components/schemas/SubscribedMessagePayload'

    UnsubscribedMessage:
      name: unsubscribed
      title: Unsubscribed Message
      summary: Confirmation of successful unsubscription
      payload:
        $ref: '#/components/schemas/UnsubscribedMessagePayload'

    ErrorMessage:
      name: error
      title: Error Message
      summary: Error message
      payload:
        $ref: '#/components/schemas/ErrorMessagePayload'

  parameters:
    Symbol:
      description: Trading symbol (e.g., BTCRUSDPERP, ETHRUSD)
      location: $message.payload#/symbol

    Address:
      description: Ethereum wallet address
      location: $message.payload#/address

  schemas:
    # Common message type enums
    ChannelDataMessageType:
      type: string
      enum:
        - channel_data
      description: Message type for channel data updates

    PingMessageType:
      type: string
      enum:
        - ping
      description: Message type for ping messages

    PongMessageType:
      type: string
      enum:
        - pong
      description: Message type for pong messages

    SubscribeMessageType:
      type: string
      enum:
        - subscribe
      description: Message type for subscribe messages

    UnsubscribeMessageType:
      type: string
      enum:
        - unsubscribe
      description: Message type for unsubscribe messages

    SubscribedMessageType:
      type: string
      enum:
        - subscribed
      description: Message type for subscribed confirmation messages

    UnsubscribedMessageType:
      type: string
      enum:
        - unsubscribed
      description: Message type for unsubscribed confirmation messages

    ErrorMessageType:
      type: string
      enum:
        - error
      description: Message type for error messages

    # Common channel patterns
    MarketsSummaryChannel:
      type: string
      enum:
        - /v2/perpMarkets/summary
