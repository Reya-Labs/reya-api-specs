    AccountUpdateData:
      type: object
      title: AccountUpdateData
      additionalProperties: false
      required:
        - accountId
        - owner
        - mainAccountId
        - spotAccountId
        - isMainPerpAccount
        - isSpotAccount
      properties:
        accountId:
          type: string
          pattern: '^\\d+$'
          description: Decimal-string account identifier whose creation or binding changed.
          example: '7'
        owner:
          $ref: './trading-schemas.json#/definitions/Address'
        mainAccountId:
          type:
            - string
            - 'null'
          pattern: '^\\d+$'
          description: Decimal-string main perp account identifier for the owner, or null when none is bound.
          example: '7'
        spotAccountId:
          type:
            - string
            - 'null'
          pattern: '^\\d+$'
          description: Decimal-string spot account identifier for the owner, or null when none is bound.
          example: null
        isMainPerpAccount:
          type: boolean
          description: Whether accountId is currently the owner's main perp account.
          example: true
        isSpotAccount:
          type: boolean
          description: Whether accountId is currently the owner's spot account.
          example: false
        removed:
          type: boolean
          description: Present and true only on the previous owner's channel during a defensive ownership rebind notification.

