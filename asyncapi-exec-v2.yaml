asyncapi: 3.0.0
info:
  title: Reya DEX Order Entry WebSocket API v2
  version: 3.6.0
  description: |
    Order-entry WebSocket API for placing, modifying, and cancelling orders and managing
    cancel-on-disconnect. Operations use the same request bodies and signing model as REST
    `POST /v2/createOrder`, `/modifyOrder`, `/cancelOrder`, `/cancelAll`, and `/cancelAllAfter`.
    Responses are correlated with requests by `id`.

    **Transport outcomes.** All five operations use the shared `RequestError` schema.
    `UNAVAILABLE_MATCHING_ENGINE_ERROR` means not accepted: re-sign with a fresh nonce,
    retaining the same `clientOrderId` when supplied, and back off during an outage.
    `ORDER_OUTCOME_UNKNOWN_ERROR` means the operation may have been applied: reconcile
    order state and executions before resubmitting; never replace an unresolved attempt
    with a fresh nonce. Both codes echo the request `nonce` and optional `clientOrderId`
    inside `error`; the envelope `id` remains separate transport correlation. Keep the
    complete original signed request. An empty lookup or `INVALID_NONCE_ERROR` is not
    proof of this attempt's outcome. Open orders alone cannot prove cancel-all-after timer
    state. See the REST HTTP 400 reference for the shared recovery rules.

    **Signing.** Each order-operation payload carries its own EIP-712 `signature`, `nonce`, and
    `deadline`. Create, modify, and cancel-all-after also require `signerWallet`; single and bulk
    cancels omit it. Reya verifies signatures, signer permissions, order validity, and applicable
    pre-trade risk checks. No connection-level authentication handshake is required.
    `deadline` controls request acceptance; `expiresAfter` controls GTT order lifetime.

    **Heartbeat and disconnects.** The server uses RFC 6455 protocol pings, normally handled by
    the client library, and closes connections after 120 seconds of inbound silence. Optional
    application-level `{type:"ping", id?}` probes receive `{type:"pong", id?}` responses.
    A disconnect does not cancel orders. An unanswered request may have been accepted;
    reconnect and reconcile order state and executions before resubmitting it.

    **Cancel-on-disconnect.** A WebSocket close does not cancel orders or fire an armed
    countdown. Use `cancelAllAfter` for timed cancellation and refresh it explicitly; pings
    and order traffic do not refresh it. See REST `POST /v2/cancelAllAfter` for the shared
    countdown controls, affected orders, and recovery rules.

    **Account rate limits and capacity.** Operation rejections use the correlated
    `*ResponseMessage` with `{ ok: false, error }`. They leave the connection open and do not
    cancel other in-flight requests. REST returns HTTP 400 carrying the same `error` code and the same `retryAfterMs`
    when present. See the REST HTTP 400 response reference for account budgets, order caps,
    capacity errors, and per-code recovery guidance. Infrastructure-level per-IP limits can
    separately return HTTP 429.

    **Connection limits.** Client-sent messages also count toward a per-connection rate limit,
    including malformed messages and invalid signatures. Exceeding it closes the socket with
    code `4029` and an advisory reason `MSG_RATE_EXCEEDED retry_after_ms=<n>`. Wait at least the
    suggested milliseconds before reconnecting; if the hint is absent or unparseable, use
    exponential backoff with jitter. Reduce message frequency before resuming, and pace retries.

    Per-IP limits also apply to new connection attempts and concurrent connections. An excess
    connection can be refused during the HTTP upgrade with status 429; the response need not
    use the venue's JSON error format. Close an existing connection or back off before retrying.
    Existing sibling connections remain usable. A concurrent-connection refusal can include
    the advisory response text `IP_CONN_LIMIT_EXCEEDED max_conns=<n>`.

    Key recovery on the close code and treat reason text as advisory. After a `4029` close,
    reconnect and reconcile unanswered requests against open orders, order updates, and executions.
    An armed cancel-all-after countdown keeps running, so refresh it before expiry if protection
    is still needed. Current rate and connection limits may differ by environment.

    For market data, positions, order updates, and executions, use the separate streaming API
    (`asyncapi-trading-v2.yaml`).
  contact:
    name: Reya Network
    url: https://reya.xyz
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  tags:
    - name: orders
      description: Order entry and cancellation
    - name: control
      description: Connection control (ping, pong, error)
  externalDocs:
    description: Reya Network Documentation
    url: https://docs.reya.xyz

servers:
  production:
    host: ws-exec.reya.xyz
    protocol: wss
    description: Production WebSocket order entry server
  devnet:
    host: ws-exec-devnet.reya-cronos.network
    protocol: wss
    description: Devnet WebSocket order entry server for Perp OB integration
  staging:
    host: ws-exec-staging.reya.xyz
    protocol: wss
    description: Staging WebSocket order entry server
  test:
    host: ws-exec-testnet.reya.xyz
    protocol: wss
    description: Test WebSocket order entry server

defaultContentType: application/json

channels:
  operations:
    description: |
      Single channel carrying all order-entry operations and connection control. Messages are id-correlated request/response pairs (`createOrder`, `modifyOrder`, `cancelOrder`, `cancelAll`, `cancelAllAfter`), an optional client-initiated `ping` probe (server replies with `pong`), and a server-side `error` envelope for framing-layer failures.
    address: null
    messages:
      createOrderRequestMessage:
        $ref: '#/components/messages/CreateOrderRequestMessage'
      createOrderResponseMessage:
        $ref: '#/components/messages/CreateOrderResponseMessage'
      modifyOrderRequestMessage:
        $ref: '#/components/messages/ModifyOrderRequestMessage'
      modifyOrderResponseMessage:
        $ref: '#/components/messages/ModifyOrderResponseMessage'
      cancelOrderRequestMessage:
        $ref: '#/components/messages/CancelOrderRequestMessage'
      cancelOrderResponseMessage:
        $ref: '#/components/messages/CancelOrderResponseMessage'
      cancelAllRequestMessage:
        $ref: '#/components/messages/CancelAllRequestMessage'
      cancelAllResponseMessage:
        $ref: '#/components/messages/CancelAllResponseMessage'
      cancelAllAfterRequestMessage:
        $ref: '#/components/messages/CancelAllAfterRequestMessage'
      cancelAllAfterResponseMessage:
        $ref: '#/components/messages/CancelAllAfterResponseMessage'
      pingMessage:
        $ref: '#/components/messages/PingMessage'
      pongMessage:
        $ref: '#/components/messages/PongMessage'
      errorMessage:
        $ref: '#/components/messages/ErrorMessage'
    bindings:
      ws: {}

operations:
  sendCreateOrder:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/createOrderRequestMessage'
    reply:
      channel:
        $ref: '#/channels/operations'
      messages:
        - $ref: '#/channels/operations/messages/createOrderResponseMessage'
    summary: Place an order
    description: |
      Create an order using the same CreateOrderRequest payload and signing requirements as
      REST POST /v2/createOrder. See that operation for execution, SL/TP firing, expiry,
      cancellation outcomes, and fill correlation.

      The server returns CreateOrderResponseMessage with the same request id. Execution and
      order updates are delivered on the separate streaming API.
  sendModifyOrder:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/modifyOrderRequestMessage'
    reply:
      channel:
        $ref: '#/channels/operations'
      messages:
        - $ref: '#/channels/operations/messages/modifyOrderResponseMessage'
    summary: Modify a resting order in place
    description: |
      Modify a resting order using the complete intended post-modify state and a fresh
      signature and nonce. The payload is `ModifyOrderRequest`, identical to REST
      `POST /v2/modifyOrder`; see that operation for targeting, modifiable fields,
      queue priority, and execution rules.

      The server returns `ModifyOrderResponseMessage` with the same request `id`.
      Per-fill details arrive on the execution and order-change streams.
  sendCancelOrder:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/cancelOrderRequestMessage'
    reply:
      channel:
        $ref: '#/channels/operations'
      messages:
        - $ref: '#/channels/operations/messages/cancelOrderResponseMessage'
    summary: Cancel an order
    description: |
      Cancel an order using the same CancelOrderRequest payload as REST POST /v2/cancelOrder.
      See that operation for targeting and protective-stop signer requirements. The server
      returns CancelOrderResponseMessage with the same request id.
  sendCancelAll:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/cancelAllRequestMessage'
    reply:
      channel:
        $ref: '#/channels/operations'
      messages:
        - $ref: '#/channels/operations/messages/cancelAllResponseMessage'
    summary: Cancel all orders for an account, optionally scoped to a market
    description: |
      Cancel an account's orders using the same MassCancelRequest payload and filters as
      REST POST /v2/cancelAll. The server returns CancelAllResponseMessage with the same
      request id.
  sendCancelAllAfter:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/cancelAllAfterRequestMessage'
    reply:
      channel:
        $ref: '#/channels/operations'
      messages:
        - $ref: '#/channels/operations/messages/cancelAllAfterResponseMessage'
    summary: Arm, refresh, or disarm the cancel-all-after countdown (cancel-on-disconnect)
    description: |
      Manage the account's countdown using the same CancelAllAfterRequest payload as REST
      POST /v2/cancelAllAfter. See that operation for controls, affected orders, refresh rules,
      and throttling. The server returns CancelAllAfterResponseMessage with the same request id.
  sendPing:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/pingMessage'
    reply:
      channel:
        $ref: '#/channels/operations'
      messages:
        - $ref: '#/channels/operations/messages/pongMessage'
    summary: Send a ping (optional)
    description: |
      Optional application-level liveness or round-trip-time probe. The server replies with `PongMessage`, echoing the optional `id`. Connection liveness also uses RFC 6455 protocol pings, normally handled by the client library; this operation is not required to keep the connection alive.

  receiveError:
    action: receive
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/errorMessage'
    summary: Receive a top-level error envelope
    description: |
      The server returns an `error` envelope for malformed JSON, an unknown `type`, a reused
      in-flight `id`, or another connection-level request error. The connection stays open.
      Operation-specific rejections, including account rate limits, instead use the corresponding
      `*ResponseMessage` with `{ ok: false, error }`, correlated by request `id`.
components:
  correlationIds:
    requestId:
      description: The envelope `id` field, used to pair a request with its response (and to echo on heartbeat / error frames where present).
      location: '$message.payload#/id'

  messages:
    CreateOrderRequestMessage:
      name: createOrderRequest
      title: Create Order Request
      summary: Client request to place an order
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CreateOrderRequestMessagePayload'

    CreateOrderResponseMessage:
      name: createOrderResponse
      title: Create Order Response
      summary: Server response to a create-order request
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CreateOrderResponseMessagePayload'

    ModifyOrderRequestMessage:
      name: modifyOrderRequest
      title: Modify Order Request
      summary: Client request to modify a resting order
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/ModifyOrderRequestMessagePayload'

    ModifyOrderResponseMessage:
      name: modifyOrderResponse
      title: Modify Order Response
      summary: Server response to a modify-order request
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/ModifyOrderResponseMessagePayload'

    CancelOrderRequestMessage:
      name: cancelOrderRequest
      title: Cancel Order Request
      summary: Client request to cancel an order
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CancelOrderRequestMessagePayload'

    CancelOrderResponseMessage:
      name: cancelOrderResponse
      title: Cancel Order Response
      summary: Server response to a cancel-order request
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CancelOrderResponseMessagePayload'

    CancelAllRequestMessage:
      name: cancelAllRequest
      title: Cancel All Request
      summary: Client request to mass-cancel orders
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CancelAllRequestMessagePayload'

    CancelAllResponseMessage:
      name: cancelAllResponse
      title: Cancel All Response
      summary: Server response to a cancel-all request
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CancelAllResponseMessagePayload'

    CancelAllAfterRequestMessage:
      name: cancelAllAfterRequest
      title: Cancel All After Request
      summary: Client request to arm, refresh, or disarm the cancel-all-after countdown
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CancelAllAfterRequestMessagePayload'

    CancelAllAfterResponseMessage:
      name: cancelAllAfterResponse
      title: Cancel All After Response
      summary: Server response to a cancel-all-after request
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/CancelAllAfterResponseMessagePayload'

    PingMessage:
      name: ping
      title: Ping Message
      summary: Optional client-initiated application-level liveness/RTT probe
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/PingMessagePayload'

    PongMessage:
      name: pong
      title: Pong Message
      summary: Server reply to a client-initiated `ping`, echoing the optional `id`
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/PongMessagePayload'

    ErrorMessage:
      name: error
      title: Error Message
      summary: Top-level error envelope
      correlationId:
        $ref: '#/components/correlationIds/requestId'
      payload:
        $ref: '#/components/schemas/ErrorMessagePayload'

  schemas:
    CreateOrderMessageType:
      type: string
      enum:
        - createOrder
      description: Message type for createOrder request and response

    ModifyOrderMessageType:
      type: string
      enum:
        - modifyOrder
      description: Message type for modifyOrder request and response

    CancelOrderMessageType:
      type: string
      enum:
        - cancelOrder
      description: Message type for cancelOrder request and response

    CancelAllMessageType:
      type: string
      enum:
        - cancelAll
      description: Message type for cancelAll request and response

    CancelAllAfterMessageType:
      type: string
      enum:
        - cancelAllAfter
      description: Message type for cancelAllAfter request and response

    PingMessageType:
      type: string
      enum:
        - ping
      description: Message type for ping messages

    PongMessageType:
      type: string
      enum:
        - pong
      description: Message type for pong messages

    ErrorMessageType:
      type: string
      enum:
        - error
      description: Message type for top-level error envelopes

    CreateOrderRequestMessagePayload:
      type: object
      title: CreateOrderRequestMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - payload
      properties:
        type:
          $ref: '#/components/schemas/CreateOrderMessageType'
        id:
          type: string
          description: Client-chosen correlation identifier; must be unique across in-flight requests on the connection.
          example: "req-7f3c1a"
        payload:
          $ref: './trading-schemas.json#/definitions/CreateOrderRequest'

    ModifyOrderRequestMessagePayload:
      type: object
      title: ModifyOrderRequestMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - payload
      properties:
        type:
          $ref: '#/components/schemas/ModifyOrderMessageType'
        id:
          type: string
          description: Client-chosen correlation identifier; must be unique across in-flight requests on the connection.
          example: "req-7f3c1e"
        payload:
          $ref: './trading-schemas.json#/definitions/ModifyOrderRequest'

    CancelOrderRequestMessagePayload:
      type: object
      title: CancelOrderRequestMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - payload
      properties:
        type:
          $ref: '#/components/schemas/CancelOrderMessageType'
        id:
          type: string
          description: Client-chosen correlation identifier; must be unique across in-flight requests on the connection.
          example: "req-7f3c1b"
        payload:
          $ref: './trading-schemas.json#/definitions/CancelOrderRequest'

    CancelAllRequestMessagePayload:
      type: object
      title: CancelAllRequestMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - payload
      properties:
        type:
          $ref: '#/components/schemas/CancelAllMessageType'
        id:
          type: string
          description: Client-chosen correlation identifier; must be unique across in-flight requests on the connection.
          example: "req-7f3c1c"
        payload:
          $ref: './trading-schemas.json#/definitions/MassCancelRequest'

    CancelAllAfterRequestMessagePayload:
      type: object
      title: CancelAllAfterRequestMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - payload
      properties:
        type:
          $ref: '#/components/schemas/CancelAllAfterMessageType'
        id:
          type: string
          description: Client-chosen correlation identifier; must be unique across in-flight requests on the connection.
          example: "req-7f3c1d"
        payload:
          $ref: './trading-schemas.json#/definitions/CancelAllAfterRequest'

    OkXorErrorEnvelope:
      title: OkXorErrorEnvelope
      description: Enforces that exactly one of `payload` / `error` is present, keyed by the `ok` discriminator. Composed into every `*ResponseMessagePayload` via `allOf`.
      allOf:
        - if:
            properties: { ok: { const: true } }
            required: [ok]
          then:
            required: [payload]
            not: { required: [error] }
        - if:
            properties: { ok: { const: false } }
            required: [ok]
          then:
            required: [error]
            not: { required: [payload] }

    CreateOrderResponseMessagePayload:
      type: object
      title: CreateOrderResponseMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - ok
      properties:
        type:
          $ref: '#/components/schemas/CreateOrderMessageType'
        id:
          type: string
          description: Echoes the request `id`.
          example: "req-7f3c1a"
        ok:
          type: boolean
          description: True on success (with `payload`), false on failure (with `error`).
        payload:
          $ref: './trading-schemas.json#/definitions/CreateOrderResponse'
        error:
          $ref: './trading-schemas.json#/definitions/RequestError'
      allOf:
        - $ref: '#/components/schemas/OkXorErrorEnvelope'

    ModifyOrderResponseMessagePayload:
      type: object
      title: ModifyOrderResponseMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - ok
      properties:
        type:
          $ref: '#/components/schemas/ModifyOrderMessageType'
        id:
          type: string
          description: Echoes the request `id`.
          example: "req-7f3c1e"
        ok:
          type: boolean
          description: True on success (with `payload`), false on failure (with `error`).
        payload:
          $ref: './trading-schemas.json#/definitions/ModifyOrderResponse'
        error:
          $ref: './trading-schemas.json#/definitions/RequestError'
      allOf:
        - $ref: '#/components/schemas/OkXorErrorEnvelope'

    CancelOrderResponseMessagePayload:
      type: object
      title: CancelOrderResponseMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - ok
      properties:
        type:
          $ref: '#/components/schemas/CancelOrderMessageType'
        id:
          type: string
          description: Echoes the request `id`.
          example: "req-7f3c1b"
        ok:
          type: boolean
          description: True on success (with `payload`), false on failure (with `error`).
        payload:
          $ref: './trading-schemas.json#/definitions/CancelOrderResponse'
        error:
          $ref: './trading-schemas.json#/definitions/RequestError'
      allOf:
        - $ref: '#/components/schemas/OkXorErrorEnvelope'

    CancelAllResponseMessagePayload:
      type: object
      title: CancelAllResponseMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - ok
      properties:
        type:
          $ref: '#/components/schemas/CancelAllMessageType'
        id:
          type: string
          description: Echoes the request `id`.
          example: "req-7f3c1c"
        ok:
          type: boolean
          description: True on success (with `payload`), false on failure (with `error`).
        payload:
          $ref: './trading-schemas.json#/definitions/MassCancelResponse'
        error:
          $ref: './trading-schemas.json#/definitions/RequestError'
      allOf:
        - $ref: '#/components/schemas/OkXorErrorEnvelope'

    CancelAllAfterResponseMessagePayload:
      type: object
      title: CancelAllAfterResponseMessagePayload
      additionalProperties: false
      required:
        - type
        - id
        - ok
      properties:
        type:
          $ref: '#/components/schemas/CancelAllAfterMessageType'
        id:
          type: string
          description: Echoes the request `id`.
          example: "req-7f3c1d"
        ok:
          type: boolean
          description: True on success (with `payload`), false on failure (with `error`).
        payload:
          $ref: './trading-schemas.json#/definitions/CancelAllAfterResponse'
        error:
          $ref: './trading-schemas.json#/definitions/RequestError'
      allOf:
        - $ref: '#/components/schemas/OkXorErrorEnvelope'

    PingMessagePayload:
      type: object
      title: PingMessagePayload
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PingMessageType'
        id:
          type: string
          description: Optional correlation identifier echoed in the corresponding pong.
          example: "ping-001"

    PongMessagePayload:
      type: object
      title: PongMessagePayload
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PongMessageType'
        id:
          type: string
          description: Echoes the corresponding ping's `id` if any.
          example: "ping-001"

    WsExecErrorCode:
      type: string
      description: |
        Framing-layer error codes emitted in the top-level `error` envelope. Operation-level errors (`RequestErrorCode` from `trading-schemas.json`) ride the per-operation `*ResponseMessage` `{ ok: false, error }` shape instead.

        - `MALFORMED_JSON` — the frame was not valid JSON.
        - `UNKNOWN_TYPE` — the frame `type` is not a recognised operation.
        - `DUPLICATE_REQUEST_ID` — a frame reused an in-flight `id`.
        - `SERVER_SHUTTING_DOWN` — the server is shutting down and rejected the request; reconnect before retrying.
        - `TOO_MANY_INFLIGHT` — the connection exceeded its per-connection in-flight request cap; retry after awaiting outstanding responses.
        - `INTERNAL` — an unexpected server-side framing error.
      enum:
        - MALFORMED_JSON
        - UNKNOWN_TYPE
        - DUPLICATE_REQUEST_ID
        - SERVER_SHUTTING_DOWN
        - TOO_MANY_INFLIGHT
        - INTERNAL

    WsExecError:
      type: object
      title: WsExecError
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          $ref: '#/components/schemas/WsExecErrorCode'
        message:
          type: string
          description: Human-readable error message.

    ErrorMessagePayload:
      type: object
      title: ErrorMessagePayload
      additionalProperties: false
      required:
        - type
        - error
      properties:
        type:
          $ref: '#/components/schemas/ErrorMessageType'
        id:
          type: string
          description: Echoes the offending request's `id` when known (e.g., for in-flight id collisions); absent for frame-level errors that couldn't be parsed.
          example: "req-7f3c1a"
        error:
          $ref: '#/components/schemas/WsExecError'
